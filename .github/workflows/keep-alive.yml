name: Keep Backend Alive

# Render's free tier sleeps the server after 15 min idle; this pings it
# every 10 min so it never sleeps. Public repo = free Actions minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ vars.BACKEND_URL }}/api/health"
