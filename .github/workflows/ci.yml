name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      # Only critical-severity: server currently carries known moderate/high
      # transitive vulns (express/body-parser/qs) whose fix is a breaking
      # Express 5 upgrade, tracked in UNFORGET.md rather than gating CI on it.
      - run: npm audit --audit-level=critical

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 22+ (not the Dockerfile's 20) because the test suite needs --experimental-test-module-mocks, which the production image never runs
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node -c server.js
      - run: npm test
      - run: npm audit --audit-level=critical

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t indiegamerhub-server:ci ./server
      - run: docker build -t indiegamerhub-client:ci ./client
