name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # jsdom@30's own package.json declares engines.node "^22.22.2 || ^24.15.0 || >=26.0.0" (it needs node:worker_threads.markAsUncloneable, added in Node 22.22.2/24.15.0); Node 20 throws inside undici's CacheStorage before any test runs.
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      # Only critical-severity: server currently carries known moderate/high
      # transitive vulns (express/body-parser/qs) whose fix is a breaking
      # Express 5 upgrade, tracked in UNFORGET.md rather than gating CI on it.
      - run: npm audit --audit-level=critical

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 26, not just "22+": mock.module() is experimental and its CJS-interop behavior for require('axios') genuinely differs between 22.23.2 and 26 (verified — 22 silently fails to intercept, hitting the real network); the production image (node:20-alpine) never runs this suite at all
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node -c server.js
      - run: npm test
      - run: npm audit --audit-level=critical

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t indiegamerhub-server:ci ./server
      - run: docker build -t indiegamerhub-client:ci ./client
